apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hdmi-switch-zot-pull-secret
  namespace: hdmi-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: hdmi-switch-zot-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {{`{"auths":{"registry.morrisons.site":{"username":"k8s-hdmi-switch","password":"{{ .password }}","auth":"{{ printf "k8s-hdmi-switch:%s" .password | b64enc }}"}}}`}}
  data:
    - secretKey: password
      remoteRef:
        key: homelab/service/k8s-zot/k8s-hdmi-switch/zot-pull
        property: value
